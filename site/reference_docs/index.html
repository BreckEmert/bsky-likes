    // ── View Animation ────────────────────────────────────────
    function flyTo(worldX, worldY) {
        if (!deckgl) return;
        deckgl.setProps({
            initialViewState: {
                target: [worldX, worldY, 0],
                zoom: Math.max(currentZoom + 2, 4),
                transitionDuration: 600,
                transitionInterpolator: new deck.LinearInterpolator(['target', 'zoom']),
            },
        });
    }

    // ── Helpers ───────────────────────────────────────────────
    function findHandle(stripped) {
        if (!handleStrings) return null;
        // Try exact match first, then with .bsky.social suffix
        const idx = handleStrings.indexOf(stripped);
        if (idx >= 0) return stripped;
        const full = stripped + '.bsky.social';
        const idx2 = handleStrings.indexOf(full);
        return idx2 >= 0 ? full : null;
    }

    function escHtml(s) {
        if (!s) return '';
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Jetstream Live Posts ─────────────────────────────────
    const didToIndex = new Map(); // DID → point index (or -1 if not on map)
    const didResolveQueue = [];
    const blips = [];
    const BLIP_DELAY = 3000;
    const BLIP_LIFETIME = 2500;
    const BLIP_MAX_RADIUS = 20;
    const MAX_BLIPS = 5000;
    const MAX_DID_CACHE = 500000;
    let jetstreamWs = null;
    let showLivePosts = document.getElementById('setting-live-posts').checked;
    let showPostText = document.getElementById('setting-post-text').checked;
    let showLikes = document.getElementById('setting-show-likes').checked;
    let firehoseEnabled = showLivePosts;

    // ── TTS (Kokoro via Web Workers) ───────────────────────
    let ttsEnabled = document.getElementById('setting-read-aloud').checked;
    let ttsVoices = [];
    let ttsLoading = false;
    const TTS_WORKER_COUNT = 2;
    const ttsWorkers = []; // { worker, busy }

    const TTS_WORKER_SRC = `
    let tts = null;
    let warming = false;
    self.onmessage = async (e) => {
        if (e.data.type === 'init') {
            try {
                const { KokoroTTS } = await import('https://esm.sh/kokoro-js@1.2.0');
                tts = await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', {
                    dtype: e.data.dtype,
                    device: e.data.device,
                    progress_callback: (p) => {
                        if (p && p.total) self.postMessage({ type: 'progress', loaded: p.loaded, total: p.total, file: p.file || '' });
                    },
                });
                const allVoices = Object.keys(tts.voices);
                self.postMessage({ type: 'ready', voices: allVoices });
                warmUpVoices(allVoices, e.data.workerIndex);
            } catch (err) {
                self.postMessage({ type: 'error', error: err.message });
            }
        } else if (e.data.type === 'speak') {
            genLock = genLock.then(async () => {
                const audio = await tts.generate(e.data.text, { voice: e.data.voice });
                self.postMessage({ type: 'audio', blob: audio.toBlob() });
            }).catch(() => {
                self.postMessage({ type: 'done' });
            });
        }
    };
    let genLock = Promise.resolve();
    async function warmUpVoices(allVoices, workerIndex) {
        for (let i = workerIndex; i < allVoices.length; i += ${TTS_WORKER_COUNT}) {
            await (genLock = genLock.then(async () => {
                await tts.generate('.', { voice: allVoices[i] });
                self.postMessage({ type: 'voice_warm', voice: allVoices[i] });
            }).catch(() => {}));
        }
    }
    `;

    function initTTS() {
        if (ttsLoading || ttsWorkers.length > 0) return;
        ttsLoading = true;
        showToast('Loading TTS model in ' + TTS_WORKER_COUNT + ' workers...');

        const hasWebGPU = !!navigator.gpu;
        const dtype = hasWebGPU ? 'fp32' : 'q4';
        const device = hasWebGPU ? 'webgpu' : 'wasm';
        const blob = new Blob([TTS_WORKER_SRC], { type: 'text/javascript' });
        const workerUrl = URL.createObjectURL(blob);
        let readyCount = 0;

        for (let i = 0; i < TTS_WORKER_COUNT; i++) {
            const w = new Worker(workerUrl);
            const entry = { worker: w, busy: false, voices: new Set() };
            ttsWorkers.push(entry);

            w.onmessage = (e) => {
                if (e.data.type === 'ready') {
                    if (ttsVoices.length === 0) ttsVoices = e.data.voices;
                    readyCount++;
                    showToast('TTS worker ' + readyCount + '/' + TTS_WORKER_COUNT + ' ready (' + (hasWebGPU ? 'WebGPU' : 'WASM') + '), warming voices...');
                    if (readyCount === TTS_WORKER_COUNT) ttsLoading = false;
                } else if (e.data.type === 'progress') {
                    if (readyCount === 0) {
                        const pct = (e.data.loaded / e.data.total * 100).toFixed(0);
                        const mb = (e.data.loaded / 1e6).toFixed(1);
                        showToast('Downloading TTS model: ' + mb + ' MB (' + pct + '%)');
                    }
                } else if (e.data.type === 'voice_warm') {
                    entry.voices.add(e.data.voice);
                    const total = new Set(ttsWorkers.flatMap(w => [...w.voices])).size;
                    if (total === 1) {
                        showToast('First TTS voice ready! Click anywhere on the map to enable audio.', Infinity);
                        document.addEventListener('click', function dismissTtsToast() {
                            document.getElementById('toast').classList.remove('show');
                            document.removeEventListener('click', dismissTtsToast);
                        }, { once: true });
                    }
                    console.log('TTS voice ready: ' + e.data.voice + ' (' + total + '/' + ttsVoices.length + ')');
                    if (total === ttsVoices.length) showToast('All ' + total + ' TTS voices ready!');
                } else if (e.data.type === 'error') {
                    console.error('TTS worker error:', e.data.error);
                    showToast('TTS worker failed to load');
                    ttsLoading = false;
                } else if (e.data.type === 'audio') {
                    entry.busy = false;
                    const url = URL.createObjectURL(e.data.blob);
                    const el = new Audio(url);
                    el.onended = () => URL.revokeObjectURL(url);
                    el.onerror = () => URL.revokeObjectURL(url);
                    el.play().catch(() => {});
                } else if (e.data.type === 'done') {
                    entry.busy = false;
                }
            };

            w.postMessage({ type: 'init', dtype, device, workerIndex: i });
        }
    }

    let lastTtsTime = 0;
    let ttsEnglishOnly = document.getElementById('setting-tts-english').checked;
    function speakPost(text, langs) {
        const now = performance.now();
        if (!ttsEnabled || !text || now - lastTtsTime < 2000) return;
        if (ttsEnglishOnly && (!langs || !langs.some(l => l.startsWith('en')))) return;
        const asciiCount = text.replace(/[^ -~]/g, '').length;
        if (asciiCount < text.length * 0.75) return;
        const idle = ttsWorkers.find(w => !w.busy && w.voices.size > 0);
        if (!idle) return;
        lastTtsTime = now;
        idle.busy = true;
        const voices = [...idle.voices];
        const voice = voices[Math.floor(Math.random() * voices.length)];
        const cleaned = text.replace(/https?:\/\/\S+/g, '').replace(/www\.\S+/g, '').trim();
        if (!cleaned) return;
        const truncated = cleaned.length > 100 ? cleaned.slice(0, 100) : cleaned;
        idle.worker.postMessage({ type: 'speak', text: truncated, voice });
    }

    if (ttsEnabled) initTTS();

    const blipCanvas = document.getElementById('blip-canvas');
    const blipCtx = blipCanvas.getContext('2d');

    function resizeBlipCanvas() {
        const dpr = window.devicePixelRatio || 1;
        blipCanvas.width = window.innerWidth * dpr;
        blipCanvas.height = window.innerHeight * dpr;
        blipCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeBlipCanvas();
    window.addEventListener('resize', resizeBlipCanvas);

    function disconnectJetstream() {
        if (jetstreamWs) {
            jetstreamWs.onclose = null;
            jetstreamWs.close();
            jetstreamWs = null;
            console.log('Jetstream disconnected by user');
        }
    }

    function connectJetstream() {
        if (!handleStrings || jetstreamWs || !firehoseEnabled) return;
        buildHandleIndex();

        let url = 'wss://jetstream2.us-east.bsky.network/subscribe?wantedCollections=app.bsky.feed.post';
        if (showLikes) url += '&wantedCollections=app.bsky.feed.like';
        jetstreamWs = new WebSocket(url);

        jetstreamWs.onopen = () => {
            console.log('Jetstream connected');
        };

        jetstreamWs.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.kind === 'commit' && msg.commit?.operation === 'create') {
                    if (msg.commit?.collection === 'app.bsky.feed.post') {
                        onPost(msg.did, msg.commit?.record?.text || '', msg.commit?.record?.langs);
                    } else if (msg.commit?.collection === 'app.bsky.feed.like' && showLikes) {
                        const uri = msg.commit?.record?.subject?.uri;
                        if (uri) {
                            // Extract post author DID from at:// URI
                            const match = uri.match(/^at:\/\/(did:[^/]+)\//);
                            if (match) onLike(match[1]);
                        }
                    }
                }
            } catch (e) {}
        };

        jetstreamWs.onclose = () => {
            console.log('Jetstream disconnected');
            jetstreamWs = null;
            if (firehoseEnabled) setTimeout(connectJetstream, 5000);
        };

        jetstreamWs.onerror = () => {
            jetstreamWs.close();
        };
    }

    function onPost(did, text, langs) {

        if (!showLivePosts) return;
        speakPost(text, langs);

        const cached = didToIndex.get(did);
        if (cached !== undefined) {
            if (cached >= 0) {
                const x = positions[cached * 2], y = positions[cached * 2 + 1];
                setTimeout(() => addBlip(x, y, text, 'post'), BLIP_DELAY);
            }
        } else {
            didResolveQueue.push({ did, t: performance.now(), text, type: 'post' });
            if (didResolveQueue.length > 1000) {
                console.log('DID resolve queue overflow, dropping 500 entries');
                didResolveQueue.splice(0, 500);
            }
        }
    }

    function onLike(authorDid) {
        const cached = didToIndex.get(authorDid);
        if (cached !== undefined) {
            if (cached >= 0) {
                const x = positions[cached * 2], y = positions[cached * 2 + 1];
                setTimeout(() => addBlip(x, y, '', 'like'), BLIP_DELAY);
            }
        } else {
            didResolveQueue.push({ did: authorDid, t: performance.now(), text: '', type: 'like' });
            if (didResolveQueue.length > 1000) {
                didResolveQueue.splice(0, 500);
            }
        }
    }

    function addBlip(worldX, worldY, text, type) {
        blips.push({ x: worldX, y: worldY, t: performance.now(), text: text || '', type: type || 'post' });
        if (blips.length > MAX_BLIPS) {
            console.log('Blips overflow, dropping', blips.length - MAX_BLIPS, 'blips');
            blips.splice(0, blips.length - MAX_BLIPS);
        }
    }

    async function resolveDids() {
        if (didResolveQueue.length === 0 || !handleIndex) return;

        if (didToIndex.size > MAX_DID_CACHE) {
            console.log('DID cache overflow, clearing', didToIndex.size, 'entries');
            didToIndex.clear();
        }

        const batch = didResolveQueue.splice(0, 25);
        const batchMeta = new Map();
        for (const e of batch) {
            if (!batchMeta.has(e.did)) batchMeta.set(e.did, []);
            batchMeta.get(e.did).push({ t: e.t, text: e.text, type: e.type || 'post' });
        }
        const dids = [...new Set(batch.map(e => e.did))];
        try {
            const params = dids.map(d => 'actors=' + encodeURIComponent(d)).join('&');
            const resp = await fetch('https://public.api.bsky.app/xrpc/app.bsky.actor.getProfiles?' + params);
            if (!resp.ok) {
                for (const did of dids) didToIndex.set(did, -1);
                return;
            }
            const data = await resp.json();
            const resolved = new Set();
            for (const profile of (data.profiles || [])) {
                const handle = profile.handle?.toLowerCase();
                resolved.add(profile.did);
                if (handle) {
                    const idx = handleIndex.get(handle);
                    didToIndex.set(profile.did, idx !== undefined ? idx : -1);
                    if (idx !== undefined) {
                        const x = positions[idx * 2], y = positions[idx * 2 + 1];
                        const metas = batchMeta.get(profile.did) || [];
                        for (const meta of metas) {
                            const elapsed = performance.now() - meta.t;
                            const remaining = BLIP_DELAY - elapsed;
                            if (remaining > 0) {
                                setTimeout(() => addBlip(x, y, meta.text, meta.type), remaining);
                            } else {
                                addBlip(x, y, meta.text, meta.type);
                            }
                        }
                    }
                } else {
                    didToIndex.set(profile.did, -1);
                }
            }
            for (const did of dids) {
                if (!resolved.has(did)) didToIndex.set(did, -1);
            }
        } catch (e) {
            for (const did of dids) {
                if (!didToIndex.has(did)) didToIndex.set(did, -1);
            }
        }
    }

    setInterval(resolveDids, 100);

    function wrapText(ctx, text, maxWidth) {
        const words = text.split(/\s+/);
        const lines = [];
        let line = '';
        for (const word of words) {
            const test = line ? line + ' ' + word : word;
            if (ctx.measureText(test).width > maxWidth && line) {
                lines.push(line);
                line = word;
                if (lines.length >= 3) { line += '...'; break; }
            } else {
                line = test;
            }
        }
        if (line) lines.push(line);
        return lines;
    }

    function renderBlips() {
        blipCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        const viewport = deckgl?.getViewports()[0];
        if (!viewport || blips.length === 0) {
            requestAnimationFrame(renderBlips);
            return;
        }

        const now = performance.now();

        // Remove expired blips
        while (blips.length > 0 && now - blips[0].t > BLIP_LIFETIME) {
            blips.shift();
        }

        for (const blip of blips) {
            const age = now - blip.t;
            const t = age / BLIP_LIFETIME;

            const screen = viewport.project([blip.x, blip.y]);
            const sx = screen[0], sy = screen[1];

            // Skip if off-screen
            if (sx < -30 || sx > window.innerWidth + 30 || sy < -30 || sy > window.innerHeight + 30) continue;

            if (blip.type === 'like') {
                // ── Like sparkle effect (subtle white) ──
                const alpha = (1 - t) * 0.5;

                // Sparkle: draw 4-point star
                const sparkleSize = 5 * (1 - t * 0.5);
                const rotation = t * Math.PI * 0.5;
                blipCtx.save();
                blipCtx.translate(sx, sy);
                blipCtx.rotate(rotation);
                blipCtx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const angle = (i * Math.PI) / 2;
                    const outerX = Math.cos(angle) * sparkleSize;
                    const outerY = Math.sin(angle) * sparkleSize;
                    const midAngle = angle + Math.PI / 4;
                    const innerR = sparkleSize * 0.25;
                    const midX = Math.cos(midAngle) * innerR;
                    const midY = Math.sin(midAngle) * innerR;
                    if (i === 0) blipCtx.moveTo(outerX, outerY);
                    else blipCtx.lineTo(outerX, outerY);
                    blipCtx.lineTo(midX, midY);
                }
                blipCtx.closePath();
                blipCtx.fillStyle = 'rgba(255, 255, 255, ' + alpha + ')';
                blipCtx.fill();
                blipCtx.restore();

                // Soft white glow
                const glowR = 4 * (1 - t * 0.3);
                const grad = blipCtx.createRadialGradient(sx, sy, 0, sx, sy, glowR);
                grad.addColorStop(0, 'rgba(255, 255, 240, ' + (alpha * 0.6) + ')');
                grad.addColorStop(1, 'rgba(255, 255, 240, 0)');
                blipCtx.beginPath();
                blipCtx.arc(sx, sy, glowR, 0, Math.PI * 2);
                blipCtx.fillStyle = grad;
                blipCtx.fill();
            } else {
                // ── Post blip (original warm white star) ──
                // Expanding ring
                const ringRadius = BLIP_MAX_RADIUS * Math.sqrt(t);
                const ringAlpha = (1 - t) * 0.3;
                blipCtx.beginPath();
                blipCtx.arc(sx, sy, ringRadius, 0, Math.PI * 2);
                blipCtx.strokeStyle = 'rgba(255, 240, 210, ' + ringAlpha + ')';
                blipCtx.lineWidth = 1;
                blipCtx.stroke();

                // Glow
                const glowR = 10 * (1 - t * 0.5);
                const grad = blipCtx.createRadialGradient(sx, sy, 0, sx, sy, glowR);
                grad.addColorStop(0, 'rgba(255, 255, 240, ' + ((1 - t) * 0.9) + ')');
                grad.addColorStop(0.3, 'rgba(255, 240, 200, ' + ((1 - t) * 0.4) + ')');
                grad.addColorStop(1, 'rgba(255, 220, 180, 0)');
                blipCtx.beginPath();
                blipCtx.arc(sx, sy, glowR, 0, Math.PI * 2);
                blipCtx.fillStyle = grad;
                blipCtx.fill();

                // Center dot
                const dotR = Math.max(1, 2.5 * (1 - t));
                blipCtx.beginPath();
                blipCtx.arc(sx, sy, dotR, 0, Math.PI * 2);
                blipCtx.fillStyle = 'rgba(255, 255, 255, ' + (1 - t) + ')';
                blipCtx.fill();

                // Post text when zoomed in
                const zoomDelta = currentZoom - initialZoom;
                if (showPostText && blip.text && zoomDelta >= 2) {
                    const textAlpha = Math.min(1, (1 - t) * 3);
                    if (textAlpha > 0.01) {
                        blipCtx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                        blipCtx.fillStyle = 'rgba(255, 255, 255, ' + textAlpha + ')';
                        blipCtx.textBaseline = 'middle';
                        const maxWidth = 250;
                        const lines = wrapText(blipCtx, blip.text, maxWidth);
                        const lineHeight = 15;
                        const startY = sy - ((lines.length - 1) * lineHeight) / 2;
                        for (let i = 0; i < lines.length; i++) {
                            blipCtx.fillText(lines[i], sx + BLIP_MAX_RADIUS + 5, startY + i * lineHeight);
                        }
                    }
                }
            }
        }

        requestAnimationFrame(renderBlips);
    }

    requestAnimationFrame(renderBlips);

    // ── Init ──────────────────────────────────────────────────
    async function init() {
        statusEl.textContent = 'Loading metadata...';
        await loadMeta();

        // Load cluster labels (non-blocking)
        fetch('cluster_labels.json').then(r => r.json()).then(data => {
            clusterLabels = data.filter(c => c.label && !c.adult);
            console.log(`Loaded ${clusterLabels.length} cluster labels`);
            updateLayers();
        }).catch(() => {});

        const { xMin, xMax, yMin, yMax } = meta.bounds;
        const cx = (xMin + xMax) / 2, cy = (yMin + yMax) / 2;

        const padding = 60;
        const scaleX = (window.innerWidth - padding * 2) / (xMax - xMin);
        const scaleY = (window.innerHeight - padding * 2) / (yMax - yMin);
        initialZoom = Math.log2(Math.min(scaleX, scaleY));
        currentZoom = initialZoom;

        // Phase 2a: density grid is tiny (~1MB), show heatmap immediately
        statusEl.textContent = 'Loading density map...';
        await loadDensityGrid();

        // Create deck.gl immediately with just the heatmap
        deckgl = new deck.Deck({
            parent: document.getElementById('deck-canvas'),
            views: new deck.OrthographicView({ flipY: false }),
            initialViewState: { target: [cx, cy, 0], zoom: initialZoom },
            controller: true,
            layers: buildLayers(),
            onViewStateChange: ({viewState}) => {
                currentZoom = viewState.zoom;
                updateLod();
                const isMobile = 'ontouchstart' in window;
                const baseRadius = isMobile ? 12 : 4;
                const avatarRadius = currentZoom >= initialZoom + 8 ? Math.max(16, Math.round(getPointSize() * 2)) / 2 : 0;
                deckgl.setProps({ pickingRadius: Math.max(baseRadius, avatarRadius) });
            },
            onHover: !('ontouchstart' in window) ? (() => {
                let lastHover = 0;
                return (info) => {
                    const now = performance.now();
                    if (now - lastHover < 50) return;
                    lastHover = now;
                    if (info.layer?.id === 'labels' && info.object) {
                        const handle = info.object.text.replace(/^@/, '').replace(/$/,'') ;
                        const fullHandle = findHandle(handle);
                        if (fullHandle) { showTooltip(info.x, info.y, fullHandle); return; }
                    }
                    if (!handleStrings || info.index < 0 || info.index >= handleStrings.length) {
                        tooltipEl.style.display = 'none';
                        return;
                    }
                    const handle = handleStrings[info.index];
                    if (handle) showTooltip(info.x, info.y, handle);
                    else tooltipEl.style.display = 'none';
                };
            })() : undefined,
            pickingRadius: 'ontouchstart' in window ? 12 : 4,
            onClick: (info) => {
                if (info.layer?.id === 'labels' && info.object) {
                    const handle = info.object.text.replace(/^@/, '');
                    const fullHandle = findHandle(handle);
                    if (fullHandle) {
                        const idx = handleStrings.indexOf(fullHandle);
                        showSidebar(fullHandle, idx);
                        return;
                    }
                }
                if (!handleStrings || info.index < 0 || info.index >= handleStrings.length) {
                    closeSidebar();
                    return;
                }
                const handle = handleStrings[info.index];
                if (handle) showSidebar(handle, info.index);
                else closeSidebar();
            },
            getCursor: ({isDragging}) => isDragging ? 'grabbing' : 'grab',
        });

        // Phase 2b: load points (~26MB), then add to scene
        statusEl.textContent = `Loading ${meta.numPoints.toLocaleString()} points...`;
        await loadPoints();
        buildPointColors();
        currentLod = getLodCount(currentZoom);
        updateLayers();

        // Phase 3: handles + followers in background (enables hover/click)
        statusEl.textContent = `${meta.numPoints.toLocaleString()} points | Loading handles...`;
        await Promise.all([loadHandles(), loadFollowers()]);
        updateLayers();
        connectJetstream();
        if (firehoseEnabled) {
            showToast('Connecting to firehose, please wait a few seconds...');
        }

        statusEl.textContent = `${meta.numPoints.toLocaleString()} points | Ready`;

        // Poll for avatar fetching at appropriate zoom levels
        setInterval(() => {
            if (currentZoom >= initialZoom + 8) updateAvatarOverlay();
        }, 1000);

    }

    init();
    </script>
</body>
</html>
